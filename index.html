<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nattduellen</title>
<!-- MQTT.js över WebSocket (WSS) – hämtas från CDN, appen är helt statisk -->
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
  :root{color-scheme:dark}
  body{font-family:system-ui,sans-serif;background:#0b1020;color:#e8ecff;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;
       margin:0;padding:24px;box-sizing:border-box}
  h1{font-size:2rem;margin:8px 0 14px}
  .hint{color:#8fa0d0;font-size:.95rem;max-width:36em;text-align:center;margin-bottom:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
  input{font-size:1.4rem;letter-spacing:.3em;text-transform:uppercase;width:8.5em;
        padding:10px;text-align:center;background:#141b36;color:#e8ecff;
        border:2px solid #46538a;border-radius:10px}
  button{font-size:1.05rem;font-weight:bold;border:none;border-radius:10px;
         padding:12px 20px;cursor:pointer}
  #connect{background:#3b82f6;color:#fff}
  #search{background:#46538a;color:#e8ecff}
  #start{background:#2ecc71;color:#06210f;font-size:1.4rem;width:min(320px,80vw);
         padding:16px;margin-top:10px}
  #start:disabled{background:#1d5c3e;color:#9fc7ae;cursor:default}
  #stop{background:#e74c3c;color:#2b0703;font-size:1.4rem;width:min(320px,80vw);
        padding:16px;margin-top:8px}
  #stop:disabled{background:#5c1d1d;color:#c7a0a0;cursor:default}
  #conn{font-size:.9rem;color:#8fa0d0;margin-bottom:10px}
  #status{font-size:1.3rem;min-height:2.2em;text-align:center;margin-bottom:16px}
  #lamps{display:flex;gap:14px;margin-bottom:24px}
  .lamp{width:42px;height:42px;border-radius:50%;background:#2a3357;
        border:2px solid #46538a;transition:all .15s}
  .lamp.on{background:#ffd94d;border-color:#ffe89a;
           box-shadow:0 0 18px 4px rgba(255,217,77,.55)}
  #found{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
  .dev{background:#1d5c3e;border:1px solid #2ecc71;color:#d9ffe6;border-radius:8px;
       padding:8px 14px;cursor:pointer;font-size:1.1rem;letter-spacing:.2em}
</style>
</head>
<body>
<h1>&#127769; Nattduellen</h1>
<div class="hint">
  Ange enhetskoden (6 tecken, visas i ESP32:ns Serial Monitor vid uppstart)
  eller sök efter enheter som är online just nu.
</div>
<div class="row">
  <input id="code" maxlength="6" placeholder="KOD" autocomplete="off" spellcheck="false">
  <button id="search">&#128269; Sök enheter</button>
  <button id="connect">Anslut</button>
</div>
<div id="found"></div>
<div id="conn">Broker: frånkopplad</div>
<div id="status">Ingen enhet vald</div>
<div id="lamps">
  <div class="lamp"></div><div class="lamp"></div><div class="lamp"></div>
  <div class="lamp"></div><div class="lamp"></div>
</div>
<button id="start" disabled>&#9654; STARTA</button>
<button id="stop" disabled>&#9632; STOPPA</button>

<script>
// Publik MQTT-broker med WebSocket+TLS. Samma broker som ESP32:n når på
// port 8883 (vanlig MQTT/TLS); webbläsaren använder WSS på port 8884.
const BROKER_URL = 'wss://broker.hivemq.com:8884/mqtt';

const $ = id => document.getElementById(id);
const statusEl = $('status'), connEl = $('conn'), foundEl = $('found'),
      startBtn = $('start'), stopBtn = $('stop'), codeEl = $('code'),
      searchBtn = $('search');
const lamps = $('lamps').children;

let client = null;
let deviceCode = null;     // vald enhetskod
let deviceOnline = false;
let lastState = null;      // senaste state-JSON från enheten
let lastRecv = 0;          // när vi tog emot det (lokala klockan, ms)
let searching = false;

function setConn(t){ connEl.textContent = t; }

function ensureClient(){
  if (client) return client;
  client = mqtt.connect(BROKER_URL, { connectTimeout: 8000, reconnectPeriod: 3000, clean: true });
  client.on('connect', () => {
    setConn('Broker: ansluten');
    if (deviceCode) subscribeDevice();
    if (searching) client.subscribe('nattduellen/+/online');
  });
  client.on('reconnect', () => setConn('Broker: återansluter…'));
  client.on('offline',   () => setConn('Broker: frånkopplad'));
  client.on('error',     () => setConn('Broker: fel – kontrollera internetanslutningen'));
  client.on('message', onMessage);
  return client;
}

function topics(){
  return {
    cmd:    'nattduellen/' + deviceCode + '/cmd',
    state:  'nattduellen/' + deviceCode + '/state',
    online: 'nattduellen/' + deviceCode + '/online'
  };
}

function subscribeDevice(){
  const t = topics();
  client.subscribe([t.state, t.online]);
}

function onMessage(topic, payload){
  const msg = payload.toString();
  if (searching && topic.endsWith('/online')){
    if (msg === '1') addFoundDevice(topic.split('/')[1]);
    return;
  }
  if (!deviceCode) return;
  const t = topics();
  if (topic === t.online){
    deviceOnline = (msg === '1');
    updateStatus();
  } else if (topic === t.state){
    try { lastState = JSON.parse(msg); lastRecv = Date.now(); updateStatus(); }
    catch(e) { /* ignorera trasiga meddelanden */ }
  }
}

// ------------------------- Sök efter enheter --------------------------------
function addFoundDevice(code){
  if (foundEl.querySelector('[data-code="' + code + '"]')) return;
  const b = document.createElement('button');
  b.className = 'dev';
  b.textContent = code;
  b.dataset.code = code;
  b.onclick = () => { codeEl.value = code; stopSearch(); connectDevice(); };
  foundEl.appendChild(b);
}

function startSearch(){
  ensureClient();
  searching = true;
  foundEl.innerHTML = '';
  searchBtn.innerHTML = '&#9209; Stoppa sökning';
  if (client.connected) client.subscribe('nattduellen/+/online');
  setTimeout(() => { if (searching) stopSearch(); }, 8000);
}

function stopSearch(){
  searching = false;
  foundEl.innerHTML = '';
  searchBtn.innerHTML = '&#128269; Sök enheter';
  if (client && client.connected) client.unsubscribe('nattduellen/+/online');
}

searchBtn.onclick = () => { searching ? stopSearch() : startSearch(); };

// ------------------------- Anslut till enhet --------------------------------
function connectDevice(){
  const code = codeEl.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6){ statusEl.textContent = 'Ange en kod på 6 tecken.'; return; }
  deviceCode = code;
  deviceOnline = false;
  lastState = null;
  ensureClient();
  if (client.connected) subscribeDevice();
  statusEl.textContent = 'Ansluter till enhet ' + code + ' …';
}

$('connect').onclick = connectDevice;
codeEl.addEventListener('input', () => { codeEl.value = codeEl.value.toUpperCase(); });
codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') connectDevice(); });

// ------------------------- Spelknappar --------------------------------------
function sendCmd(cmd){
  if (client && client.connected && deviceCode){
    client.publish(topics().cmd, cmd, { qos: 1 });
  }
}
startBtn.onclick = () => sendCmd('start');
stopBtn.onclick  = () => sendCmd('stop');

// ------------------------- Status & lampor ----------------------------------
function paintLamps(s){
  for (let i = 0; i < lamps.length; i++){
    const on = s && (s.state === 'armed' || (s.state === 'done' && i !== s.darkLed));
    lamps[i].classList.toggle('on', !!on);
  }
}

function updateStatus(){
  if (!deviceCode){ statusEl.textContent = 'Ingen enhet vald'; return; }
  if (!deviceOnline){
    statusEl.textContent = 'Enhet ' + deviceCode + ' är offline';
    startBtn.disabled = stopBtn.disabled = true;
    paintLamps(null);
    return;
  }
  const s = lastState;
  startBtn.disabled = !s || s.state === 'armed';
  stopBtn.disabled = false;
  if (!s){
    statusEl.textContent = 'Enhet ' + deviceCode + ' online – redo';
    paintLamps(null);
    return;
  }
  if (s.state === 'armed'){
    const el = s.elapsedMs + (Date.now() - lastRecv);  // räkna vidare lokalt mellan meddelanden
    statusEl.textContent = 'Alla lampor tända… håll utkik! (' + (el/1000).toFixed(1) + ' s)';
  } else if (s.state === 'done'){
    statusEl.textContent = '💥 Lampa ' + (s.darkLed + 1) + ' slocknade efter ' +
                          (s.elapsedMs/1000).toFixed(2) + ' s!';
  } else {
    statusEl.textContent = 'Enhet ' + deviceCode + ' online – redo, tryck STARTA';
  }
  paintLamps(s);
}

setInterval(updateStatus, 150);
</script>
</body>
</html>
